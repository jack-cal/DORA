<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>白皮書摘要與現行規則</title><style>body{max-width:900px;margin:30px auto;padding:24px;font:18px/1.8 system-ui;color:#183248;background:#f5f8fc}a{color:#175f9e}nav{display:flex;flex-wrap:wrap;gap:14px}p{overflow-wrap:anywhere}aside{border:1px solid #b9cadd;padding:18px}</style><h1>白皮書摘要與現行規則</h1><p>從來源區塊9,600起，必須驗證活躍見證人的選定證明。保留先前紀錄。請提前更新節點和錢包；舊版在累積工作量相同時可能選擇不同的鏈。待處理工作的歷史也會保留。</p><p>從來源區塊9,600起，候選名單須有活動回應及鏈上錨定世代超過三分之二成員的核准。既有信標抽取三名見證人，事件抽取機率仍為20%。啟用後，待完成工作可保留A/B區塊對及事件信標，更新見證人選取輪次。舊回應封存，不混用不同輪次。憑證不證明營運者相互獨立或全球可達。準備紀錄、選中工作、完成證明是不同計數，11減9不能說明完成了2份證明。</p></html>
