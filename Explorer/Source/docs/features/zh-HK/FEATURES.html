<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{max-width:1040px;margin:32px auto;padding:24px;font:17px/1.8 system-ui}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}pre{white-space:pre-wrap}</style><h1>SUMUWW Explorer 0.4.11</h1>
<p>瀏覽器以 yugeon/vB 顯示費率。如本機節點有交易替換紀錄，交易頁面會提供新交易的連結。以鏈上確認紀錄為準，本機替換歷史的儲存數量有限。</p>
<p><code>1 yugeon = 0.00000001 SMW</code></p>
<p><code>1 SMW = 100,000,000 yugeon</code></p>
<p>瀏覽器顯示已公開的多重簽署及輸出鎖定條件。主網啟用時間尚未確定。</p>
<p>挖礦紀錄分別顯示每個區塊的新增發行獎勵、交易手續費獎勵和總獎勵，錢包實際收到的金額會另外顯示。若只領取部分獎勵，系統不會自行推定兩類獎勵的分配。節點提供 28 個 RPC 方法，包括手續費估算，並驗證及轉發已簽署交易。</p></html>
