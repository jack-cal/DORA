<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>白皮书摘要与现行规则</title><style>body{max-width:900px;margin:30px auto;padding:24px;font:18px/1.8 system-ui;color:#183248;background:#f5f8fc}a{color:#175f9e}nav{display:flex;flex-wrap:wrap;gap:14px}p{overflow-wrap:anywhere}aside{border:1px solid #b9cadd;padding:18px}</style><h1>白皮书摘要与现行规则</h1><p>从源区块9,600起，必须验证活跃见证人的选择证明。保留此前记录。请提前更新节点和钱包；旧版在累计工作量相同时可能选择不同的链。待处理任务的历史也会保留。</p><p>从源区块9,600起，候选名单须有活动响应及链上锚定代际超过三分之二成员的批准。既有信标抽取三名见证人，事件抽取概率仍为20%。启用后，待完成任务可保留A/B区块对及事件信标，更新见证人选取轮次。旧响应归档，不混用不同轮次。证书不证明运营者相互独立或全球可达。准备记录、选中任务、完成证明是不同计数，11减9不能说明完成了2份证明。</p></html>
