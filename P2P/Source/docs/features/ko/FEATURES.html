<p>P2P는 서명된 SUMUWW 거래를 전파하기 전에 연결된 노드에서 검사합니다. 검사에서 거절되면 전파하지 않습니다. 합의한 교환 금액과 수수료는 유지되며, 비트코인 수수료는 별도 단위를 사용합니다.</p>
<p><code>1 yugeon = 0.00000001 SMW</code></p>
<p><code>1 SMW = 100,000,000 yugeon</code></p></html>
