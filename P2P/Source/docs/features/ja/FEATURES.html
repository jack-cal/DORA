<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{max-width:1040px;margin:32px auto;padding:24px;font:17px/1.8 system-ui}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}pre{white-space:pre-wrap}</style><h1>SUMUWW P2P Full / Light 0.3.4</h1>
<p>P2P は署名済み SUMUWW 取引を送信する前に、接続中のノードで検査します。拒否された取引は送信しません。合意済みの交換額と手数料は維持され、Bitcoin の手数料には固有の単位を使います。</p>
<p><code>1 yugeon = 0.00000001 SMW</code></p>
<p><code>1 SMW = 100,000,000 yugeon</code></p></html>
